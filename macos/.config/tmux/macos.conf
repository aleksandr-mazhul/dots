set -g @copy_command 'pbcopy'

# Clipboard copy binds live ONLY in the OS files. common/.tmux.conf sources this
# file near its top, so a copy-pipe bind left in common would load later and
# clobber this one (the reference's wl-copy binds did exactly that).
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy" # copy text with "y"
# Mouse selection → system clipboard, stay in copy-mode
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "pbcopy"
