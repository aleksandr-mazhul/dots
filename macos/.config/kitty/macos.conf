# macOS: match WezTerm RESIZE chrome + blur 100 from macos.lua.
hide_window_decorations titlebar-only
macos_show_window_title_in none
background_blur 100
macos_traditional_fullscreen no
macos_option_as_alt no

# tmux window switch (Linux Ctrl -> mac Cmd).
map cmd+page_up    send_text all \x02p
map cmd+page_down  send_text all \x02n
# Ctrl+H/L -> nvim code<->tree, only when the focused window is actually nvim
# (focus_nvim_pane.py guards against the escape sequence leaking into a plain
# shell as literal text); otherwise forwarded as Alt-h/Alt-l for tmux panes.
map ctrl+h         kitten focus_nvim_pane.py tree
map ctrl+l         kitten focus_nvim_pane.py code
# Ctrl+J/K always forward as Alt-j/Alt-k, which tmux's vim-tmux-navigator
# bindings route as pane/window navigation.
map ctrl+j         send_text all \x1bj
map ctrl+k         send_text all \x1bk
# Cmd+V: text -> normal paste; image-only clipboard -> raw ^V so Claude Code
# attaches it. See smart_paste.py. Fallback if it ever breaks:
# map cmd+v paste_from_clipboard
map cmd+v          kitten smart_paste.py
# Cmd+Alt+N: new window WITHOUT auto-attaching tmux
map cmd+alt+n      launch --type=os-window --cwd=current --env NO_TMUX=1
# Font zoom (plain Cmd; kitty_mod defaults remain ctrl+shift)
map cmd+equal      change_font_size all +1.0
map cmd+plus       change_font_size all +1.0
map cmd+minus      change_font_size all -1.0
map cmd+underscore change_font_size all -1.0
