# Shared Kitty look: match WezTerm (font, size, palette, opacity).
# OS extras live in macos.conf / linux.conf and are pulled in only if present.

font_family      MesloLGS Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 19

background_opacity 0.95
window_padding_width 0
hide_window_decorations yes
tab_bar_style hidden
remember_window_size yes
confirm_os_window_close 0
cursor_shape block

# Tmux prefix is C-a. WezTerm used SendString("\x01"); Kitty must inject the
# byte or tmux never sees prefix (extended-keys is off, TERM=xterm-kitty).
map ctrl+a send_text all \x01
map cmd+i send_text all \x01
map super+i send_text all \x01

foreground #CBE0F0
background #011423
cursor #47FF9C
cursor_text_color #011423
selection_foreground #CBE0F0
selection_background #033259

color0  #214969
color1  #E52E2E
color2  #44FFB1
color3  #FFE073
color4  #0FC5ED
color5  #a277ff
color6  #24EAF7
color7  #24EAF7
color8  #214969
color9  #E52E2E
color10 #44FFB1
color11 #FFE073
color12 #A277FF
color13 #a277ff
color14 #24EAF7
color15 #24EAF7

# WezTerm tmux helpers (Cmd on macOS, Super on Linux).
map cmd+shift+[ send_text all \x01p
map cmd+shift+] send_text all \x01n
map cmd+shift+h send_text all \x1bH
map cmd+shift+l send_text all \x1bL
map cmd+shift+{ send_text all \x01p
map cmd+shift+} send_text all \x01n
map cmd+{ send_text all \x01p
map cmd+} send_text all \x01n

map super+shift+[ send_text all \x01p
map super+shift+] send_text all \x01n
map super+shift+h send_text all \x1bH
map super+shift+l send_text all \x1bL
map super+shift+{ send_text all \x01p
map super+shift+} send_text all \x01n
map super+{ send_text all \x01p
map super+} send_text all \x01n

globinclude macos.conf
globinclude linux.conf
